name: Pad
options:
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.1.5"
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    PAD_APP_IDENTIFIER: me.cyzr.pad
    PAD_DISPLAY_NAME: PadPad
  configs:
    Debug:
      PAD_APP_IDENTIFIER: me.cyzr.pad.dev
      PAD_DISPLAY_NAME: PadPad Dev
targets:
  Pad:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
          - Resources/MenuBarIcon.png
          - Resources/pad-squiggle.png
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PAD_DISPLAY_NAME)
        CFBundleName: $(PAD_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, net.daringfireball.markdown]
            CFBundleTypeExtensions: [txt, md]
    entitlements:
      path: App/Pad.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WebKit helper processes require this even for the offline editor; its page blocks remote resources.
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: $(PAD_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: Pad
        PRODUCT_BUNDLE_IDENTIFIER: $(PAD_APP_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDEV
        Release:
          CODE_SIGN_STYLE: $(PAD_DISTRIBUTION_SIGNING_STYLE)
          PROVISIONING_PROFILE_SPECIFIER: $(PAD_DISTRIBUTION_PROFILE)
    preBuildScripts:
      - name: Build editor
        basedOnDependencyAnalysis: false
        shell: /bin/zsh
        script: |
          set -euo pipefail
          export PATH="$HOME/Library/pnpm:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CI=true
          cd "$SRCROOT/editor"
          pnpm install --frozen-lockfile --silent
          pnpm build --logLevel warn
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Editor"
          mkdir -p "$DEST"
          cp dist/index.html "$DEST/index.html"
  PadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Pad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PAD_APP_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(PAD_DISPLAY_NAME).app/Contents/MacOS/$(PAD_DISPLAY_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        ENABLE_HARDENED_RUNTIME: NO
  PadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Pad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PAD_APP_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pad
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Pad UI Tests:
    build:
      targets:
        Pad: all
        PadUITests: [test]
    test:
      config: Debug
      targets:
        - name: PadUITests
          parallelizable: false
  Pad:
    build:
      targets:
        Pad: all
        PadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: PadTests
          parallelizable: false
    archive:
      config: Release
